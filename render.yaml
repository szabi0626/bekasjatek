# Render.com Blueprint: one web service that serves the game and runs the game server.
services:
  - type: web
    name: bekasjatek
    runtime: node
    # Free plan: 0.1 CPU, sleeps when idle. Starter (0.5 CPU, ~$7/month) gives headroom for bigger games.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
